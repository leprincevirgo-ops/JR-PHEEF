name: JR PHEEF feature branch verification

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - "fresh-foundation/jr-pheef-v1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jr-pheef-feature-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full project and quantum test suite
        run: npm test
