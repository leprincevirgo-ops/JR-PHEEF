name: JR PHEEF release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: jr-pheef-release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-route-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve compatible dependency security updates
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --ignore-scripts --no-fund
      - name: Install the resolved, locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check server, route modules, inline scripts and assets
        run: npm test
      - name: Persist the tested dependency lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: lock compatible dependency security updates"
            git push
          else
            echo "Dependency lockfile is already current."
          fi
      - name: Report remaining high and critical advisories
        run: npm audit --audit-level=high

  deployed-read-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify live service journeys without writing production data
        env:
          BASE_URL: https://jr-pheef-marketplace.onrender.com
          REQUIRE_PAYMENTS_OFF: "true"
          SMOKE_ATTEMPTS: "3"
        run: node scripts/e2e-smoke.js
