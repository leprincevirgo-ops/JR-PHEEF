name: JP privacy regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [privacy/jp-identity-private]

jobs:
  privacy-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install application dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check routes/messages.js
          node --check routes/market.js
          node --check routes/delivery.js
          node --check public/jp-contacts-ui.js
          node --check public/command-centre-social.js
      - name: Run JR PHEEF regression suite
        run: npm test
