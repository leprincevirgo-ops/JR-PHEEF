name: JR PHEEF Android companion
on:
  push:
    branches: [build/jr-pheef-os-foundation]
    paths:
      - "os/android-companion/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "os/android-companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        working-directory: os/android-companion
        run: gradle assembleDebug
      - name: Upload debug APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: jr-pheef-android-companion-debug
          path: os/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
