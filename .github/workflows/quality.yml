name: JR PHEEF quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check server JavaScript syntax
        run: node --check server.js
      - name: Check inline browser JavaScript
        run: node scripts/check-inline-scripts.js
