name: JR PHEEF checks

on:
  push:
    branches: [main, "market-readiness/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax and route integrity tests
        run: npm test
      - name: Read-only live deployment smoke test
        env:
          BASE_URL: https://jr-pheef-marketplace.onrender.com
          REQUIRE_OPPORTUNITY_FEATURE: "true"
          REQUIRE_PAYMENTS_OFF: "true"
        run: npm run test:e2e
      - name: Report high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
