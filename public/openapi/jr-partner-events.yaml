openapi: 3.1.0
info:
  title: JR PHEEF Partner Event API
  version: 0.3.0
  description: Limited member-scoped inbound event gateway. This is not a general-purpose read/write API.
servers:
  - url: https://jr-pheef-marketplace.onrender.com
paths:
  /api/jr/integrations:
    get:
      summary: List the signed-in member's partner connections
      security: [{ jrSession: [] }]
      responses:
        '200': { description: Connection list }
        '401': { description: Login required }
    post:
      summary: Create a one-time-display events:write credential
      security: [{ jrSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 3, maxLength: 60 }
      responses:
        '201': { description: Connection and one-time token returned }
        '401': { description: Login required }
  /api/jr/integrations/events:
    get:
      summary: Read the signed-in member's private event inbox
      security: [{ jrSession: [] }]
      responses:
        '200': { description: Private events }
        '401': { description: Login required }
  /api/jr/integrations/{id}:
    delete:
      summary: Revoke a member-owned connection
      security: [{ jrSession: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Revoked }
        '404': { description: Not found or already revoked }
  /api/inbound/jr/events:
    post:
      summary: Submit an allowlisted event to a member's private inbox
      security: [{ partnerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, title, summary, external_event_id]
              properties:
                event_type:
                  type: string
                  enum: [status_update, task_update, inventory_update, delivery_update, message_received, calendar_update, other]
                title: { type: string, minLength: 2, maxLength: 100 }
                summary: { type: string, minLength: 2, maxLength: 500 }
                external_event_id: { type: string, minLength: 3, maxLength: 120 }
                occurred_at: { type: string, format: date-time }
                event_data:
                  type: object
                  additionalProperties: false
                  properties:
                    status: { type: string, maxLength: 120 }
                    category: { type: string, maxLength: 120 }
                    quantity: { type: string, maxLength: 120 }
                    unit: { type: string, maxLength: 120 }
                    location_label: { type: string, maxLength: 120 }
                    description: { type: string, maxLength: 120 }
      responses:
        '202': { description: Accepted into private inbox; no external action executed }
        '401': { description: Invalid or revoked credential }
        '429': { description: Rate limit reached }
components:
  securitySchemes:
    jrSession:
      type: apiKey
      in: cookie
      name: jr_session
    partnerBearer:
      type: http
      scheme: bearer
      bearerFormat: jr_live token
